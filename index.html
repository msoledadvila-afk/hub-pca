function getDelta(p,c){ if(p===null||p===undefined||!c) return null; return c-p; }
function deltaLabel(d){
  if(d===null) return null;
  if(d>4)  return {text:"+"+d+" pts ↑↑",color:"#16a34a",bg:"#dcfce7",icon:"🚀"};
  if(d>0)  return {text:"+"+d+" pts ↑", color:"#16a34a",bg:"#dcfce7",icon:"📈"};
  if(d===0)return {text:"Sin cambio →", color:"#d97706",bg:"#fef3c7",icon:"➡️"};
  return       {text:d+" pts ↓",        color:"#dc2626",bg:"#fee2e2",icon:"⚠️"};
}
function getPackReco(catScores, totalPct){
  const pcts = Object.fromEntries(Object.entries(catScores).map(([k,v])=>[k,v/25]));
  const crit = Object.entries(pcts).filter(([,v])=>v<0.4).map(([k])=>k);
  let pk;
  if(totalPct<0.35) pk="institucional";
  else if(crit.includes("decisiones")&&(crit.includes("procesos")||crit.includes("tiempo"))) pk="mentoria";
  else if((pcts.comunicacion<0.55||crit.includes("comunicacion"))&&(pcts.documental<0.55||crit.includes("documental"))) pk="equipo";
  else pk="autonomia";
  const pack=PACKS[pk];
  const msgs={
    tiempo:"Pérdida significativa de horas en tareas operativas y búsqueda de información. Con IA puede reducirse 60-70%.",
    procesos:"Tareas repetitivas sin sistematizar y falta de documentación generan retrabajo constante.",
    comunicacion:"La redacción manual y la falta de plantillas consumen tiempo valioso. Con prompts validados, baja de horas a minutos.",
    documental:"Información dispersa genera fricción operativa. Un sistema de documentos con IA cambia esto radicalmente.",
    decisiones:"Sin criterios claros de delegación y priorización, se pierde capacidad estratégica.",
  };
  const sorted = Object.entries(pcts).sort(([,a],[,b])=>a-b);
  const bottlenecks = sorted.slice(0,3).map(([cid,pct])=>{
    const cat=CATS.find(c=>c.id===cid);
    return {cat:cat.label,icon:cat.icon,pct,text:msgs[cid]};
  });
  return {pack,pk,bottlenecks};
}
function getNextStep(prevTotal, currTotal, catDeltas){
  const pp=prevTotal/125, cp=currTotal/125, imp=cp-pp;
  const stag=Object.values(catDeltas).filter(d=>d!==null&&d<=0).length;
  const reg=Object.values(catDeltas).filter(d=>d!==null&&d<0).length;
  if(cp>=0.80) return {icon:"🏆",color:"#16a34a",bg:"#f0fdf4",title:"Cierre exitoso del proceso",desc:"El cliente alcanzó un nivel de eficiencia muy alto. El sistema PCA™ está consolidado. Se recomienda cerrar el proceso formal y ofrecer mantenimiento trimestral o un nuevo desafío.",accion:"Proponer: Pack de Mantenimiento PCA™ o Mentoría Estratégica"};
  if(imp>=0.20&&cp>=0.65) return {icon:"⬆️",color:C.teal,bg:"#f0fdf9",title:"Escalar al siguiente nivel",desc:"La mejora es sólida. Es el momento para proponer un pack de mayor profundidad.",accion:"Proponer: Mentoría Estratégica 1:1 o Pack Digital Equipo"};
  if(imp>=0.10&&stag<=2) return {icon:"🔄",color:C.azul,bg:"#EEF3FB",title:"Continuar y profundizar",desc:"Hay mejora clara pero queda recorrido. Continuar con el pack actual, foco en los sistemas aún no implementados.",accion:"Continuar pack actual · Nueva sesión en 30 días"};
  if(reg>=2) return {icon:"🛠️",color:"#dc2626",bg:"#fef2f2",title:"Revisión de implementación urgente",desc:"Se detectan retrocesos. Los sistemas no se están usando en el día a día.",accion:"Sesión de revisión · Identificar obstáculos concretos"};
  return {icon:"💬",color:"#d97706",bg:"#fffbeb",title:"Reforzar implementación",desc:"La mejora es moderada. El cliente necesita más acompañamiento en la aplicación práctica.",accion:"Sesión de implementación práctica · Follow-up en 15 días"};
}

function hubCol(name){ return db.collection(`artifacts/${APP_ID}/public/data/hub_pca_${name}`); }

async function fbSaveClient(data, id){
  if(id) { await hubCol("clientes").doc(id).update({...data, updatedAt: Date.now()}); return id; }
  const ref = await hubCol("clientes").add({...data, createdAt: Date.now(), updatedAt: Date.now()});
  return ref.id;
}
async function fbDeleteClient(id){ await hubCol("clientes").doc(id).delete(); }

async function fbSaveChecklist(clientId, state){
  await hubCol("checklists").doc(clientId).set({state, updatedAt: Date.now()}, {merge: true});
}
async function fbLoadChecklist(clientId){
  const snap = await hubCol("checklists").doc(clientId).get();
  return snap.exists ? (snap.data().state || {}) : {};
}
async function fbLogSession(clientId, sessionData){
  await hubCol("sesiones").add({clientId, ...sessionData, createdAt: Date.now()});
}

function RBar({label,score,max}){
  const pct=max>0?score/max:0;
  const bg=pct<0.4?"#fee2e2":pct<0.7?"#fef3c7":"#dcfce7";
  const tc=pct<0.4?"#dc2626":pct<0.7?"#d97706":"#16a34a";
  const bar=pct<0.4?"#ef4444":pct<0.7?"#f59e0b":"#22c55e";
  const lbl=pct<0.4?"🔴 CRÍTICO":pct<0.7?"🟡 MEJORABLE":"🟢 BIEN";
  return <div style={{marginBottom:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
      <span style={{fontSize:12,fontWeight:500,color:"#1e293b"}}>{label}</span>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        <span style={{fontSize:10.5,color:"#64748b"}}>{score}/{max}</span>
        <span style={{fontSize:9.5,fontWeight:700,padding:"2px 7px",borderRadius:20,background:bg,color:tc}}>{lbl}</span>
      </div>
    </div>
    <div style={{height:6,background:"#f1f5f9",borderRadius:99}}>
      <div style={{height:"100%",width:(pct*100)+"%",background:bar,borderRadius:99,transition:"width .7s cubic-bezier(.4,0,.2,1)"}}/>
    </div>
  </div>;
}

function ChecklistPanel({clientId}){
  const [state, setState] = useState({});
  const [open, setOpen] = useState({p0:true});
  const [saving, setSaving] = useState(false);
  const saveTimer = useRef(null);

  useEffect(()=>{
    if(!clientId) return;
    fbLoadChecklist(clientId).then(s=>setState(s||{}));
  },[clientId]);

  const toggle = async (itemId) => {
    const next = {...state, [itemId]: !state[itemId]};
    setState(next);
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async()=>{
      setSaving(true);
      await fbSaveChecklist(clientId, next);
      setSaving(false);
    }, 800);
  };

  const togglePhase = (idx) => setOpen(o=>({...o,["p"+idx]:!o["p"+idx]}));

  const totalItems = CK_PHASES.reduce((s,p)=>s+p.items.length,0);
  const totalDone  = CK_PHASES.reduce((s,p)=>s+p.items.filter(i=>state[i.id]).length,0);
  const globalPct  = totalItems>0?Math.round((totalDone/totalItems)*100):0;

  const resetAll = async () => {
    setState({});
    await fbSaveChecklist(clientId, {});
  };

  return <div>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <div>
        <div style={{fontSize:13,color:C.muted}}>{totalDone} de {totalItems} tareas · {globalPct}% completado</div>
        <div style={{height:4,background:"#e2e8f0",borderRadius:2,marginTop:5,width:220}}>
          <div style={{height:"100%",width:globalPct+"%",background:C.verde,borderRadius:2,transition:"width .3s"}}/>
        </div>
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {saving&&<span style={{fontSize:11,color:C.muted}}>Guardando...</span>}
        <button className="btn-h" onClick={resetAll} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"#fff",color:C.muted,fontSize:12,cursor:"pointer"}}>↺ Reiniciar</button>
      </div>
    </div>

    {CK_PHASES.map((phase,idx)=>{
      const doneCnt = phase.items.filter(i=>state[i.id]).length;
      const total   = phase.items.length;
      const pct     = total>0?Math.round((doneCnt/total)*100):0;
      const allDone = doneCnt===total;
      const isOpen  = open["p"+idx];
      return <div key={idx} className={"ck-phase"+(isOpen?" open":"")+(allDone?" all-done":"")}>
        <div className="ck-phase-header" onClick={()=>togglePhase(idx)}>
          <span className="ck-num" style={{background:phase.bgColor,color:phase.color}}>{phase.num}</span>
          <div style={{flex:1,minWidth:0}}>
            <div className="ck-title">{phase.title}</div>
            <div className="ck-sub">{phase.sub}</div>
          </div>
          <span className="ck-badge-done">Completa</span>
          <span style={{fontSize:11,color:C.muted,marginRight:7}}>{doneCnt}/{total}</span>
          <span className="ck-chevron">▾</span>
        </div>
        <div className="ck-prog-bar"><div className="ck-prog-fill" style={{width:pct+"%"}}/></div>
        <div className="ck-items">
          {phase.items.map(item=><div key={item.id} className={"ck-item"+(state[item.id]?" done":"")} onClick={()=>toggle(item.id)}>
            <div className="ck-check"><span className="ck-check-inner">✓</span></div>
            <div>
              <div className="ck-label">{item.label}</div>
              <div className="ck-note">{item.note}</div>
            </div>
          </div>)}
        </div>
      </div>;
    })}
  </div>;
}

          <div>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <div style={{width:3,height:20,background:C.gold,borderRadius:2}}/>
              <h1 style={{fontSize:16,fontWeight:700,color:"#fff",fontFamily:"'Cormorant Garamond',serif"}}>Sesión de Seguimiento PCA™</h1>
            </div>
            <p style={{fontSize:10.5,color:"#99f6e4",marginLeft:10}}>👤 {client.nombre}{client.empresa?" · "+client.empresa:""}</p>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <div style={{textAlign:"right"}}><div style={{fontSize:19,fontWeight:700,color:C.gold,fontFamily:"'Cormorant Garamond',serif"}}>{comp}/25</div><div style={{fontSize:8.5,color:"#99f6e4"}}>completadas</div></div>
          {hasPrev&&impPct!==null&&<div style={{textAlign:"center",background:"rgba(255,255,255,.15)",borderRadius:9,padding:"4px 10px"}}>
            <div style={{fontSize:17,fontWeight:700,color:impPct>=0?"#bbf7d0":"#fecaca",fontFamily:"'Cormorant Garamond',serif"}}>{impPct>=0?"+":""}{impPct}%</div>
            <div style={{fontSize:8,color:"#99f6e4",fontWeight:600}}>MEJORA</div>
          </div>}
          <button className="btn-h" onClick={()=>setClearing(true)} style={{padding:"6px 11px",borderRadius:8,border:"1.5px solid rgba(255,255,255,.25)",background:"transparent",color:"rgba(255,255,255,.85)",fontSize:11,fontWeight:600}}>🗂️ Limpiar</button>
          <button className="btn-h" onClick={doExport} style={{padding:"7px 15px",borderRadius:8,border:"none",background:exported?"#22c55e":C.gold,color:"#fff",fontSize:11.5,fontWeight:700,whiteSpace:"nowrap"}}>{exported?"✓ Descargado":"⬇ Exportar Excel"}</button>
        </div>
      </div>
      <div style={{maxWidth:980,margin:"8px auto 0",height:3,background:"rgba(255,255,255,.15)",borderRadius:99}}>
        <div style={{height:"100%",width:((comp/25)*100)+"%",background:C.gold,borderRadius:99,transition:"width .4s ease"}}/>
      </div>
    </div>

    <div style={{maxWidth:980,margin:"0 auto",padding:"18px 13px 65px"}}>
      {/* DATOS SESIÓN */}
      <div style={{background:"#fff",borderRadius:12,padding:"16px 20px",marginBottom:16,boxShadow:"0 2px 10px rgba(0,0,0,.05)",border:"1.5px solid "+C.teal+"33"}}>
        <h2 style={{margin:"0 0 12px",fontSize:10.5,fontWeight:700,color:C.teal,textTransform:"uppercase",letterSpacing:1.2}}>Datos de la Sesión</h2>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{flex:"0 0 120px"}}>
            <label style={{fontSize:9.5,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",display:"block",marginBottom:5}}>Sesión Nº</label>
            <select value={sessNum} onChange={e=>setSessNum(e.target.value)} style={{width:"100%",padding:"8px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13.5,color:C.text,background:"#fff"}}>
              {["1","2","3","4","5","6+"].map(n=><option key={n} value={n}>Sesión {n}</option>)}
            </select>
          </div>
          <div style={{flex:"1 1 175px"}}>
            <label style={{fontSize:9.5,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",display:"block",marginBottom:5}}>Pack utilizado</label>
            <select value={pack} onChange={e=>setPack(e.target.value)} style={{width:"100%",padding:"8px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13.5,color:C.text,background:"#fff"}}>
              <option value="">Seleccionar...</option>
              <option>Pack Autonomía PCA™</option><option>Pack Digital Equipo</option>
              <option>Mentoría Estratégica 1:1</option><option>Consultoría Institucional PCA™</option>
            </select>
          </div>
          <div style={{flex:"1 1 145px"}}>
            <label style={{fontSize:9.5,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",display:"block",marginBottom:5}}>Inicio del proceso</label>
            <input value={startD} onChange={e=>setStartD(e.target.value)} placeholder="Ej: 15/01/2025" style={{width:"100%",padding:"8px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:13.5,color:C.text}}/>
          </div>
        </div>
      </div>

      {/* PUNTAJES INICIALES */}
      <div style={{background:"#fff",borderRadius:12,padding:"16px 20px",marginBottom:16,boxShadow:"0 2px 10px rgba(0,0,0,.05)",border:"1px solid #e2e8f0"}}>
        <h2 style={{margin:"0 0 5px",fontSize:10.5,fontWeight:700,color:C.teal,textTransform:"uppercase",letterSpacing:1.2}}>Puntajes del Diagnóstico Inicial</h2>
        <p style={{fontSize:11,color:C.muted,marginBottom:12}}>Ingresá los puntajes del Excel de auditoría original (0–25 por categoría). Opcional.</p>
        <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
          {CATS.map(cat=><div key={cat.id} style={{flex:"1 1 120px",minWidth:110}}>
            <label style={{fontSize:10,color:cat.color,fontWeight:700,display:"block",marginBottom:5}}>{cat.icon} {cat.label}</label>
            <input type="number" min="0" max="25" value={prev[cat.id]}
              onChange={e=>setPrev(p=>({...p,[cat.id]:e.target.value}))}
              placeholder="0–25" style={{width:"100%",padding:"8px 11px",borderRadius:8,border:"1.5px solid "+cat.color+"44",fontSize:15,fontWeight:700,color:cat.color,textAlign:"center",background:prev[cat.id]?cat.light:"#fff"}}/>
          </div>)}
        </div>
        {hasPrev&&<div style={{marginTop:9,padding:"6px 11px",background:"#f0fdf9",borderRadius:7,fontSize:11.5,color:"#0d5c56",fontWeight:600}}>✓ Puntaje total inicial: <strong>{prevTot}/125</strong></div>}
      </div>

      {/* NAV PILLS */}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:16}}>
        {CATS.map(cat=>{
          const f=FQ[cat.id].filter(q=>ans[q.id]?.puntaje).length;
          return <a key={cat.id} href={"#fc-"+cat.id} className="npill" style={{display:"flex",alignItems:"center",gap:4,padding:"5px 10px",borderRadius:20,background:"#fff",border:"2px solid "+cat.color+"22",color:cat.color,fontSize:10.5,fontWeight:600,textDecoration:"none",whiteSpace:"nowrap"}}>
            <span>{cat.icon}</span><span>{cat.label}</span>
            <span style={{background:cat.color,color:"#fff",borderRadius:99,padding:"1px 5px",fontSize:9.5}}>{f}/5</span>
          </a>;
        })}
      </div>

      {CATS.map(cat=><div key={cat.id} id={"fc-"+cat.id} style={{marginBottom:20}}>
        <div style={{background:cat.light,borderRadius:"11px 11px 0 0",padding:"11px 17px",display:"flex",alignItems:"center",gap:8,borderBottom:"3px solid "+cat.color}}>
          <span style={{fontSize:17}}>{cat.icon}</span>
          <div>
            <h2 style={{fontSize:13.5,fontWeight:700,color:cat.color,fontFamily:"'Cormorant Garamond',serif"}}>{cat.label}</h2>
            <p style={{fontSize:10,color:"#64748b"}}>
              Puntaje actual: {catSc[cat.id]}/25{prev[cat.id]&&" · Inicial: "+prev[cat.id]+"/25"}
              {catDel[cat.id]!==null&&(()=>{const dl=deltaLabel(catDel[cat.id]);return dl?<span style={{marginLeft:5,fontWeight:700,color:dl.color}}> {dl.icon} {dl.text}</span>:null;})()}
            </p>
          </div>
        </div>
        <div style={{background:"#f8fafc",padding:"11px 4px 4px",borderRadius:"0 0 11px 11px",border:"1px solid #e2e8f0",borderTop:"none"}}>
          {FQ[cat.id].map(q=><QCard key={q.id} question={q} catColor={cat.color} catLight={cat.light} answers={ans} onChange={handle}/>)}
          <div style={{margin:"4px 4px",background:"#fff",borderRadius:9,padding:"11px 13px",border:"1.5px dashed #e2e8f0"}}>
            <label style={{fontSize:9.5,color:C.muted,fontWeight:700,letterSpacing:.5,textTransform:"uppercase",display:"block",marginBottom:5}}>🧱 Obstáculos en esta categoría</label>
            <textarea rows={2} value={obst[cat.id]} onChange={e=>setObst(p=>({...p,[cat.id]:e.target.value}))}
              placeholder="¿Qué impidió implementar mejor en esta área?" style={{width:"100%",padding:"7px 9px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:11.5,resize:"vertical",color:"#374151",lineHeight:1.55}}/>
          </div>
        </div>
      </div>)}

      {/* COMPARATIVA */}
      {comp>=5&&<div className="fade-in" style={{background:"#fff",borderRadius:12,padding:"20px",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,.05)",border:"1px solid #e2e8f0"}}>
        <h2 style={{margin:"0 0 16px",fontSize:14,fontWeight:700,color:"#1a2e5c",fontFamily:"'Cormorant Garamond',serif"}}>{hasPrev?"📊 Evolución por Categoría":"📊 Resultados Actuales"}</h2>
        {CATS.map(cat=>{
          const p=prev[cat.id]?parseInt(prev[cat.id]):null, c2=catSc[cat.id];
          const d=getDelta(p,c2), dl=deltaLabel(d);
          return <div key={cat.id} style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
              <span style={{fontSize:12.5,fontWeight:600,color:"#1e293b"}}>{cat.icon} {cat.label}</span>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {dl&&<span className="delta-anim" style={{fontSize:10.5,fontWeight:700,padding:"2px 8px",borderRadius:20,background:dl.bg,color:dl.color}}>{dl.icon} {dl.text}</span>}
                <span style={{fontSize:10.5,color:C.muted}}>{p!=null?p+"→"+c2:c2+"/25"}</span>
              </div>
            </div>
            {p!=null&&<div style={{marginBottom:4}}><div style={{fontSize:9,color:C.muted,marginBottom:2,fontWeight:600}}>DIAGNÓSTICO INICIAL</div><div style={{height:5,background:"#f1f5f9",borderRadius:99}}><div style={{height:"100%",width:((p/25)*100)+"%",background:"#94a3b8",borderRadius:99}}/></div></div>}
            <div><div style={{fontSize:9,color:C.teal,marginBottom:2,fontWeight:700}}>SEGUIMIENTO ACTUAL</div>
              <div style={{height:8,background:"#f1f5f9",borderRadius:99}}>
                <div style={{height:"100%",width:((c2/25)*100)+"%",background:c2/25>=0.7?"#22c55e":c2/25>=0.4?"#f59e0b":"#ef4444",borderRadius:99,transition:"width .7s"}}/>
              </div>
            </div>
          </div>;
        })}
        <div style={{marginTop:12,padding:"11px 15px",borderRadius:9,background:totCurr/125>=0.7?"#f0fdf4":totCurr/125>=0.4?"#fffbeb":"#fef2f2",border:"2px solid "+(totCurr/125>=0.7?"#16a34a":totCurr/125>=0.4?"#d97706":"#dc2626")+"33",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:9}}>
          <div><div style={{fontSize:12.5,fontWeight:700,color:"#1e293b"}}>Puntaje Total Actual</div>{hasPrev&&<div style={{fontSize:10.5,color:C.muted,marginTop:2}}>Inicial: {prevTot}/125</div>}</div>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            {hasPrev&&impPct!==null&&<div style={{textAlign:"center",background:impPct>=0?"#dcfce7":"#fee2e2",borderRadius:8,padding:"4px 11px"}}>
              <div style={{fontSize:17,fontWeight:700,color:impPct>=0?"#16a34a":"#dc2626",fontFamily:"'Cormorant Garamond',serif"}}>{impPct>=0?"+":""}{impPct}%</div>
              <div style={{fontSize:8.5,fontWeight:700,color:impPct>=0?"#16a34a":"#dc2626"}}>DE MEJORA</div>
            </div>}
            <div style={{textAlign:"center"}}><div style={{fontSize:21,fontWeight:700,color:C.teal,fontFamily:"'Cormorant Garamond',serif"}}>{totCurr}/125</div><div style={{fontSize:9.5,color:C.muted}}>{Math.round((totCurr/125)*100)}% eficiencia</div></div>
          </div>
        </div>
      </div>}

      {/* LOGROS */}
      <div style={{background:"#fff",borderRadius:12,padding:"18px 20px",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,.05)",border:"1px solid #e2e8f0"}}>
        <h2 style={{margin:"0 0 6px",fontSize:13.5,fontWeight:700,color:"#1a2e5c",fontFamily:"'Cormorant Garamond',serif"}}>🏅 Logros Concretos del Cliente</h2>
        <p style={{fontSize:11,color:C.muted,marginBottom:11}}>Pedile al cliente que verbalice sus victorias.</p>
        {[0,1,2].map(i=><div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
          <div style={{width:25,height:25,borderRadius:"50%",background:C.teal,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
          <input value={logros[i]} onChange={e=>{const n=[...logros];n[i]=e.target.value;setLogros(n);}}
            placeholder={["¿Qué es lo que más mejoró en tu trabajo diario?","¿Qué herramienta o sistema fue el más útil?","¿Qué le dirías a otro profesional sobre este proceso?"][i]}
            style={{flex:1,padding:"8px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:12.5,color:C.text}}/>
        </div>)}
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:11,padding:"10px 13px",background:"#f0fdf9",borderRadius:9}}>
          <span style={{fontSize:12,color:"#0d5c56",fontWeight:600}}>⏱ Horas recuperadas estimadas por semana:</span>
          <input value={horas} onChange={e=>setHoras(e.target.value)} placeholder="Ej: 6 horas"
            style={{width:105,padding:"6px 11px",borderRadius:8,border:"1.5px solid "+C.teal+"44",fontSize:13,fontWeight:700,color:C.teal,textAlign:"center",background:"#fff"}}/>
        </div>
      </div>

      {nxtSt&&<div className="fade-in" style={{background:nxtSt.bg,border:"2px solid "+nxtSt.color+"33",borderRadius:12,padding:"18px 20px",marginBottom:14}}>
        <h2 style={{margin:"0 0 11px",fontSize:14,fontWeight:700,color:"#1a2e5c",fontFamily:"'Cormorant Garamond',serif"}}>🧭 Próximo Paso Recomendado</h2>
        <div style={{display:"flex",alignItems:"flex-start",gap:11}}>
          <span style={{fontSize:27,flexShrink:0}}>{nxtSt.icon}</span>
          <div>
            <div style={{fontSize:14.5,fontWeight:700,color:nxtSt.color,fontFamily:"'Cormorant Garamond',serif",marginBottom:5}}>{nxtSt.title}</div>
            <p style={{fontSize:12,color:"#374151",lineHeight:1.6,marginBottom:9}}>{nxtSt.desc}</p>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,background:nxtSt.color,color:"#fff",borderRadius:8,padding:"6px 13px",fontSize:11.5,fontWeight:600}}>▶ {nxtSt.accion}</div>
          </div>
        </div>
      </div>}

      <div style={{background:"#fff",borderRadius:12,padding:"18px 20px",marginBottom:16,boxShadow:"0 2px 10px rgba(0,0,0,.05)",border:"1px solid #e2e8f0"}}>
        <h2 style={{margin:"0 0 6px",fontSize:13.5,fontWeight:700,color:"#1a2e5c",fontFamily:"'Cormorant Garamond',serif"}}>✏️ Notas del Consultor</h2>
        <textarea rows={4} value={notes} onChange={e=>setNotes(e.target.value)}
          placeholder="Ej: El cliente implementó los prompts pero todavía no sistematizó la delegación..."
          style={{width:"100%",padding:"9px 11px",borderRadius:8,border:"1.5px solid #e2e8f0",fontSize:12,resize:"vertical",color:"#1e293b",lineHeight:1.6}}/>
      </div>

      <div style={{display:"flex",gap:9,justifyContent:"center",flexWrap:"wrap"}}>
        <button className="btn-h" onClick={()=>setClearing(true)} style={{padding:"9px 22px",borderRadius:10,border:"2px solid #e2e8f0",background:"#fff",color:C.muted,fontSize:12.5,fontWeight:600}}>🗂️ Limpiar</button>
        <button className="btn-h" onClick={doExport} style={{padding:"10px 34px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#0d5c56,"+C.teal+")",color:"#fff",fontSize:12.5,fontWeight:700,boxShadow:"0 4px 20px "+C.teal+"44"}}>⬇ Exportar Informe a Excel</button>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════════
   APP ROOT — con Firebase Auth
══════════════════════════════════════ */
function App(){
  const [screen, setScreen] = useState("home");
  const [client, setClient] = useState(null);
  const [fbReady, setFbReady] = useState(false);

  useEffect(()=>{
    const unsub = auth.onAuthStateChanged(user=>{
      if(!user){ auth.signInAnonymously().catch(()=>{}); }
      else { setFbReady(true); }
    });
    return ()=>unsub();
  },[]);

  const go = (sc, cl) => { setClient(cl||null); setScreen(sc); window.scrollTo({top:0}); };

  if(!fbReady) return <div style={{minHeight:"100vh",background:C.crema,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center",color:C.muted}}>
      <div style={{fontSize:32,marginBottom:12}}>✨</div>
      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:20,color:C.text,marginBottom:6}}>Hub PCA™</div>
      <div style={{fontSize:13}}>Conectando con Firebase...</div>
    </div>
  </div>;

  if(screen==="checklist") return <ChecklistScreen client={client} onBack={()=>go("home")}/>;
  if(screen==="audit")     return <AuditScreen     client={client} onBack={()=>go("home")}/>;
  if(screen==="follow")    return <FollowScreen    client={client} onBack={()=>go("home")}/>;
  return <HomeScreen
    onAudit={c=>go("audit",c)}
    onFollow={c=>go("follow",c)}
    onChecklist={c=>go("checklist",c)}
  />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
