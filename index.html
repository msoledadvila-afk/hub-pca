  <style>
    /* ── Design System — idéntico a Presupuestos PCA™ ── */
    :root{
      --dorado:#9A7B3D; --dorado-suave:#B8995A; --dorado-profundo:#75582A;
      --cream:#EFE9DB;  --piedra:#DDD8D4; --calido:#E3D7D2;
      --card:#FFFFFF;   --borde:#C8C0B5;
      --texto:#1A1814;  --texto-sec:#6E6859;
      --ok:#0F6E56;     --alerta:#9A3D3D;
      --shadow:0 8px 20px rgba(26,24,20,.08);
      --shadow-sm:0 2px 8px rgba(26,24,20,.06);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Outfit',system-ui,sans-serif;background:var(--cream);color:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    input,select,textarea,button{font-family:inherit}
    textarea:focus,input:focus,select:focus{outline:2px solid var(--dorado-suave);outline-offset:-1px;border-color:var(--dorado-suave)!important}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--dorado-suave);border-radius:99px}

    /* ── Topbar ── */
    .topbar{background:var(--card);border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:20;box-shadow:var(--shadow-sm)}
    .topbar-inner{max-width:900px;margin:0 auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    .brand .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dorado);font-weight:600}
    .brand h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
    .brand .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--texto-sec)}
    .topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    /* ── Buttons ── */
    .btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 18px;border:none;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:var(--dorado);color:#fff}
    .btn-primary:hover{background:var(--dorado-profundo)}
    .btn-ghost{background:transparent;border:1px solid var(--borde);color:var(--texto-sec)}
    .btn-ghost:hover{border-color:var(--dorado-suave);color:var(--texto)}
    .btn-danger{background:transparent;border:1px solid #fca5a5;color:#dc2626}
    .btn-danger:hover{background:#fee2e2}
    .btn-sm{padding:6px 13px;font-size:12.5px;border-radius:8px}
    .btn-link{background:transparent;border:none;color:var(--dorado);font-size:13px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

    /* ── Layout ── */
    .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
    .section-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:22px}
    .section-head h2{font-size:20px;font-weight:600}
    .section-head p{color:var(--texto-sec);font-size:13.5px;margin-top:3px}

    /* ── Panel / Card ── */
    .panel{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:22px;box-shadow:var(--shadow-sm);margin-bottom:18px}
    .panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dorado);font-weight:700;margin-bottom:14px}
    .client-card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow-sm);transition:.15s;border-left:4px solid var(--dorado)}
    .client-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}

    /* ── Stats ── */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
    .stat-card{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);text-align:center}
    .stat-card .val{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--dorado);line-height:1}
    .stat-card .lbl{font-size:11px;color:var(--texto-sec);margin-top:4px}

    /* ── Chips / Badges ── */
    .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
    .chip-audit{background:#DBEAFE;color:#1E40AF}
    .chip-follow{background:#D1FAE5;color:#065F46}
    .chip-ck{background:#FEF9C3;color:#854D0E}
    .chip-date{background:var(--piedra);color:var(--texto-sec)}

    /* ── Form field ── */
    .field{margin-bottom:13px}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--texto-sec);margin-bottom:5px;letter-spacing:.03em}
    .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--borde);border-radius:9px;background:#fff;color:var(--texto)}
    .field input::placeholder{color:#aaa}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    /* ── Modal ── */
    .modal-ov{position:fixed;inset:0;background:rgba(26,24,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
    .modal-box{background:var(--card);border-radius:16px;padding:28px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.22)}
    .modal-sm{max-width:480px}
    .modal-lg{max-width:600px}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
    .modal-head h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--dorado-profundo)}
    .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--texto-sec);line-height:1;padding:0}

    /* ── Search ── */
    .search-wrap{position:relative;margin-bottom:18px}
    .search-wrap input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--borde);border-radius:10px;font-size:13.5px;background:var(--card)}
    .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--texto-sec);font-size:15px;pointer-events:none}

    /* ── Import list ── */
    .import-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1px solid var(--borde);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}
    .import-item:hover{background:var(--cream);border-color:var(--dorado-suave)}
    .import-item .name{font-weight:600;font-size:14px}
    .import-item .meta{font-size:12px;color:var(--texto-sec);margin-top:2px}

    /* ── Checklist ── */
    .ck-phase{background:var(--card);border:1px solid var(--borde);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
    .ck-phase-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
    .ck-phase-hd:hover{background:var(--cream)}
    .ck-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
    .ck-title{font-size:14px;font-weight:600;flex:1}
    .ck-sub{font-size:11px;color:var(--texto-sec)}
    .ck-chevron{font-size:13px;color:var(--texto-sec);transition:transform .2s}
    .ck-chevron.open{transform:rotate(90deg)}
    .ck-body{border-top:1px solid var(--borde);padding:10px 16px 14px}
    .ck-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--piedra)}
    .ck-item:last-child{border-bottom:none}
    .ck-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--borde);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:.15s}
    .ck-check.done{background:var(--ok);border-color:var(--ok);color:#fff;font-size:11px}
    .ck-label{font-size:13px;color:var(--texto);line-height:1.45}
    .ck-label.done{text-decoration:line-through;color:var(--texto-sec)}
    .ck-note{font-size:11px;color:var(--texto-sec);margin-top:2px}
    .ck-prog{height:3px;background:var(--piedra);border-radius:2px;margin:0 16px 0}
    .ck-prog-fill{height:100%;background:var(--ok);border-radius:2px;transition:width .3s}

    /* ── Audit/Follow inner ── */
    .inner-topbar{background:var(--card);border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:20;box-shadow:var(--shadow-sm)}
    .inner-topbar-wrap{max-width:960px;margin:0 auto;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .inner-client-badge{display:flex;align-items:center;gap:10px}
    .inner-avatar{width:34px;height:34px;border-radius:50%;background:var(--cream);border:2px solid var(--dorado);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--dorado);flex-shrink:0}
    .inner-name{font-size:14px;font-weight:600}
    .inner-sub{font-size:11px;color:var(--texto-sec)}

    /* ── QCard (audit/follow questions) ── */
    .qcard{background:var(--card);border:1px solid var(--borde);border-left:4px solid var(--dorado);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
    .qcard p{font-size:13.5px;color:var(--texto);line-height:1.55;font-weight:500;margin-bottom:11px}
    .q-row{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-start}
    .q-lbl{font-size:10px;color:var(--texto-sec);font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px}
    .q-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:1px}
    .q-chip-btn{padding:4px 9px;border-radius:20px;font-size:11.5px;font-weight:600;border:1.5px solid var(--borde);background:#fff;color:var(--texto-sec);cursor:pointer;transition:.12s}
    .q-chip-btn.sel{background:var(--dorado);border-color:var(--dorado);color:#fff}
    .q-snp-btn{padding:5px 16px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--borde);background:#fff;color:var(--texto-sec);cursor:pointer;transition:.12s}
    .q-snp-btn.sel{background:var(--dorado);border-color:var(--dorado);color:#fff}
    .q-score-btn{width:48px;padding:6px 0;border-radius:8px;border:2px solid var(--borde);background:#fff;color:var(--texto-sec);font-weight:700;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
    .q-score-btn.sel{background:var(--dorado);border-color:var(--dorado);color:#fff;box-shadow:0 2px 8px rgba(154,123,61,.35)}
    .q-score-btn:hover{transform:scale(1.07)}
    .q-textarea{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--borde);font-size:13px;resize:vertical;color:var(--texto);margin-top:4px;background:#fff}
    .q-textarea-notes{width:100%;padding:7px 9px;border-radius:8px;border:1.5px dashed var(--borde);font-size:11.5px;resize:vertical;color:var(--texto-sec);background:var(--cream);margin-top:4px}

    /* ── Results ── */
    .rbar-wrap{margin-bottom:13px}
    .rbar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .rbar-label{font-size:13px;font-weight:600}
    .rbar-track{height:7px;background:var(--piedra);border-radius:99px}
    .rbar-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}

    /* ── Pack card ── */
    .pack-card{border-radius:12px;padding:22px;margin-bottom:14px}
    .pack-card ul{list-style:none;padding:0;margin:10px 0}
    .pack-card li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-bottom:5px}

    /* ── Delta chips ── */
    .delta-up{background:#D1FAE5;color:#065F46;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
    .delta-dn{background:#FEE2E2;color:#991B1B;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
    .delta-eq{background:var(--piedra);color:var(--texto-sec);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}

    /* ── Toast ── */
    .toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none}
    .toast{background:var(--texto);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.25s;white-space:nowrap}
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.ok{background:var(--ok)}.toast.err{background:var(--alerta)}

    /* ── Misc ── */
    .empty{text-align:center;padding:56px 20px;color:var(--texto-sec)}
    .empty .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:28px;color:var(--texto);margin-bottom:8px}
    .divider{height:1px;background:var(--borde);margin:18px 0}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .fade-in{animation:fadeIn .3s ease forwards}

    @media(max-width:640px){
      .topbar-inner{padding:12px 16px}
      .wrap{padding:18px 14px 70px}
      .row2{grid-template-columns:1fr}
      .q-row{flex-direction:column}
    }
  </style>
</head>

/* ── Recommendation engine (igual que siempre) ── */
function getPackReco(catScores, totalPct){
  const pcts = Object.fromEntries(Object.entries(catScores).map(([k,v])=>[k,v/25]));
  const crit = Object.entries(pcts).filter(([,v])=>v<0.4).map(([k])=>k);
  const imp  = Object.entries(pcts).filter(([,v])=>v>=0.4&&v<0.7).map(([k])=>k);
  let packKey, reasoning;
  if(totalPct<0.35){ packKey="institucional"; reasoning="El diagnóstico revela una situación crítica transversal. Se requiere una intervención sistémica en todos los niveles de la organización."; }
  else if(crit.includes("decisiones")&&(crit.includes("procesos")||crit.includes("tiempo"))){ packKey="mentoria"; reasoning="El perfil muestra dificultades estructurales en toma de decisiones combinadas con procesos o tiempo. El problema no es de herramientas sino de arquitectura de liderazgo."; }
  else if((pcts.comunicacion<0.55||crit.includes("comunicacion"))&&(pcts.documental<0.55||crit.includes("documental"))){ packKey="equipo"; reasoning="Los cuellos de botella en comunicación y gestión documental impactan a equipos completos. La solución requiere sistematizar flujos colaborativos."; }
  else{ packKey="autonomia"; reasoning="El diagnóstico identifica oportunidades claras de optimización individual. Con el sistema correcto podés recuperar 5-10 horas semanales de inmediato."; }
  const pack = PACKS[packKey];
  const sorted = Object.entries(pcts).sort(([,a],[,b])=>a-b);
  const msgs = {
    tiempo:"Gestión del tiempo: Se detecta pérdida significativa de horas en tareas operativas y búsqueda de información.",
    procesos:"Procesos operativos: Tareas repetitivas sin sistematizar y falta de documentación generan retrabajo constante.",
    comunicacion:"Comunicación: La redacción manual y falta de plantillas consumen tiempo que podría destinarse a trabajo estratégico.",
    documental:"Gestión documental: La información dispersa genera fricción operativa y decisiones demoradas.",
    decisiones:"Toma de decisiones: Ausencia de criterios claros de delegación y priorización impactan en la eficiencia del liderazgo.",
  };
  const bottlenecks = sorted.slice(0,3).map(([cid,pct])=>{
    const cat=CATS.find(c=>c.id===cid);
    return {cat:cat.label,icon:cat.icon,pct,text:msgs[cid]};
  });
  const recoText = `El diagnóstico muestra un perfil ${totalPct<0.4?"crítico":totalPct<0.7?"con potencial de mejora":"con base sólida"}. Con el ${pack.name}, implementaremos un sistema personalizado que ataca directamente estos cuellos de botella. Resultado esperado: ${pack.outcome}.`;
  return {pack,packKey,reasoning,bottlenecks,recoText};
}

function getDelta(p,c){ if(p===null||p===undefined||!c) return null; return c-p; }
function deltaLabel(d){
  if(d===null) return null;
  if(d>4)  return {text:"+"+d+" pts ↑↑",cls:"delta-up",icon:"🚀"};
  if(d>0)  return {text:"+"+d+" pts ↑", cls:"delta-up",icon:"📈"};
  if(d===0)return {text:"Sin cambio →", cls:"delta-eq",icon:"➡️"};
  return       {text:d+" pts ↓",         cls:"delta-dn",icon:"⚠️"};
}
function getNextStep(prevTotal,currTotal,catDeltas){
  const cp=currTotal/125;
  const imp=(cp)-(prevTotal/125);
  const stag=Object.values(catDeltas).filter(d=>d!==null&&d<=0).length;
  const reg=Object.values(catDeltas).filter(d=>d!==null&&d<0).length;
  if(cp>=0.80) return {icon:"🏆",color:"#16a34a",bg:"#f0fdf4",title:"Cierre exitoso",desc:"El sistema PCA™ está consolidado. Se recomienda cerrar el proceso formal y ofrecer mantenimiento trimestral.",accion:"Proponer: Pack de Mantenimiento o Mentoría Estratégica"};
  if(imp>=0.20&&cp>=0.65) return {icon:"⬆️",color:"#0f766e",bg:"#f0fdf9",title:"Escalar al siguiente nivel",desc:"La mejora es sólida. Es el momento para proponer un pack de mayor profundidad.",accion:"Proponer: Mentoría Estratégica 1:1 o Pack Digital Equipo"};
  if(imp>=0.10&&stag<=2) return {icon:"🔄",color:"#2E5090",bg:"#EEF3FB",title:"Continuar y profundizar",desc:"Hay mejora clara pero queda recorrido. Foco en los 1-2 sistemas aún no implementados.",accion:"Continuar pack actual · Nueva sesión en 30 días"};
  if(reg>=2) return {icon:"🛠️",color:"#dc2626",bg:"#fef2f2",title:"Revisión urgente",desc:"Se detectan retrocesos. Los sistemas no se están usando en el día a día.",accion:"Sesión de revisión de implementación · Identificar obstáculos"};
  return {icon:"💬",color:"#d97706",bg:"#fffbeb",title:"Reforzar implementación",desc:"La mejora es moderada. El cliente necesita más acompañamiento práctico.",accion:"Sesión práctica · Follow-up en 15 días"};
}

function RBar({label,score,max,prev}){
  const pct = max>0?score/max:0;
  const status = pct<0.4?"🔴 CRÍTICO":pct<0.7?"🟡 MEJORABLE":"🟢 BIEN";
  const bg = pct<0.4?"#fee2e2":pct<0.7?"#fef3c7":"#dcfce7";
  const tc = pct<0.4?"#dc2626":pct<0.7?"#d97706":"#16a34a";
  const fill = pct<0.4?"#ef4444":pct<0.7?"#f59e0b":"#22c55e";
  const delta = prev!=null ? getDelta(prev,score) : null;
  const dl = deltaLabel(delta);
  return <div className="rbar-wrap">
    <div className="rbar-head">
      <span className="rbar-label">{label}</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        {dl&&<span className={dl.cls}>{dl.icon} {dl.text}</span>}

        <span style={{fontSize:10,fontWeight:700,padding:"2px 9px",borderRadius:20,background:bg,color:tc}}>{status}</span>
      </div>
    </div>
    {prev!=null&&<div style={{marginBottom:4}}>
      <div style={{fontSize:9,color:"var(--texto-sec)",marginBottom:2,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>Inicial</div>
      <div className="rbar-track"><div className="rbar-fill" style={{width:`${(prev/max)*100}%`,background:"#94a3b8"}}/></div>

    {prev!=null&&<div style={{fontSize:9,color:"var(--dorado)",marginBottom:2,fontWeight:600,textTransform:"uppercase",letterSpacing:.4}}>Actual</div>}
    <div className="rbar-track"><div className="rbar-fill" style={{width:`${pct*100}%`,background:fill}}/></div>

}

        data.push([i===0?cat.icon+" "+cat.label:"",q.text,a.respuesta||"",a.puntaje||"",a.notas||""]);
      });
      data.push(["","","","",""]);
    });

    const ws=XL.utils.aoa_to_sheet(data); ws["!cols"]=[{wch:24},{wch:50},{wch:28},{wch:12},{wch:30}];

    <div style={{maxWidth:960,margin:"0 auto",padding:"24px 16px 80px"}}>

              <div style={{fontSize:15,fontWeight:700,color:cat.color,fontFamily:"'Cormorant Garamond',serif"}}>{cat.label}</div>

          <div style={{background:"#f8fafc",padding:"12px 4px 4px",borderRadius:"0 0 12px 12px",border:"1px solid var(--borde)",borderTop:"none"}}>

      {/* Resultados */}
      <div className="panel">

        {CATS.map(cat=><RBar key={cat.id} label={cat.icon+" "+cat.label} score={catSc[cat.id]} max={25}/>)}

      {/* Pack recomendado */}
      {reco&&<div className="pack-card fade-in" style={{background:reco.pack.bg,border:"2px solid "+reco.pack.color+"33",marginBottom:18}}>

function FollowScreen({client,onBack}){

  const [dashLoading,setDashLoading]= useState(false);
  const [dashSearch, setDashSearch] = useState("");
  const [form,       setForm]       = useState({nombre:"",empresa:"",industria:"",tel:"",email:""});
  const [delId,      setDelId]      = useState(null);

  useEffect(()=>{
    const unsub = hubCol("clientes").orderBy("createdAt","desc").onSnapshot(snap=>{
      setClients(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },()=>setLoading(false));
    return ()=>unsub();
  },[]);

  const filtered = clients.filter(c=>(c.nombre+c.empresa+c.industria).toLowerCase().includes(search.toLowerCase()));

  const addClient = async () => {
    if(!form.nombre.trim()){ toast("El nombre es obligatorio","err"); return; }
    try{
      await fbSaveClient({...form,sesiones:[]},null);
      setForm({nombre:"",empresa:"",industria:"",tel:"",email:""});
      setShowAdd(false); toast("Cliente agregado ✓","ok");
    } catch(e){ toast("Error al guardar","err"); }
  };
  const delClient = async id => { await fbDeleteClient(id); setDelId(null); toast("Cliente eliminado"); };

  /* ── Importar del Dashboard ── */
  const openImport = async () => {
    setShowImport(true); setDashSearch("");
    if(dashClients.length>0) return; // ya cargados
    setDashLoading(true);
    try{
      const snap = await col("clientes").orderBy("name").get();
      setDashClients(snap.docs.map(d=>({id:d.id,...d.data()})));
    } catch(e){ toast("Error al cargar clientes del Dashboard","err"); }
    setDashLoading(false);
  };

  const importClient = (dc) => {
    /* Mapeo de campos Dashboard → Hub */
    setForm({
      nombre:  dc.name    || "",
      empresa: dc.company || "",
      industria: "",   /* Dashboard no tiene industria */
      tel:     dc.phone || dc.contact || "",
      email:   dc.email || "",
    });
    setShowImport(false);
    setShowAdd(true);
    toast("Datos importados — revisá y guardá","ok");
  };

  const dashFiltered = dashClients.filter(c=>
    (c.name||"").toLowerCase().includes(dashSearch.toLowerCase())||
    (c.company||"").toLowerCase().includes(dashSearch.toLowerCase())
  );

  const today = new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  const totalAud = clients.reduce((a,c)=>a+(c.sesiones||[]).filter(s=>s.tipo==="audit").length,0);
  const totalFol = clients.reduce((a,c)=>a+(c.sesiones||[]).filter(s=>s.tipo==="follow").length,0);

  return <div style={{minHeight:"100vh",background:"var(--cream)"}}>

    {/* TOPBAR */}
    <div className="topbar">
      <div className="topbar-inner">
        <div className="brand">
          <span className="eyebrow">Talento Impulsa</span>
          <h1>Hub PCA™</h1>
          <span className="sub">CRM de clientes · Auditoría · Seguimiento · Onboarding</span>
        </div>
        <div className="topbar-actions">
          <span style={{fontSize:12,color:"var(--texto-sec)",textTransform:"capitalize"}}>{today}</span>
          <a href="https://msoledadvila-afk.github.io/talento-impulsa-dashboard/" target="_blank" className="btn btn-ghost btn-sm">← Dashboard</a>
          <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>＋ Nuevo cliente</button>
        </div>
      </div>
    </div>

    <div className="wrap">
      {/* Stats */}
      <div className="stats-grid">
        {[
          {val:clients.length,     lbl:"Clientes activos",       icon:"👤"},
          {val:totalAud,           lbl:"Auditorías realizadas",   icon:"📋"},
          {val:totalFol,           lbl:"Sesiones de seguimiento", icon:"📈"},
        ].map(s=><div key={s.lbl} className="stat-card">
          <div style={{fontSize:22,marginBottom:4}}>{s.icon}</div>
          <div className="val">{s.val}</div>
          <div className="lbl">{s.lbl}</div>
        </div>)}
      </div>

      {/* Search */}
      {clients.length>2&&<div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar cliente por nombre, empresa o industria..."/>
      </div>}

      {/* Client list */}
      {loading?(
        <div className="empty"><p>Cargando clientes...</p></div>
      ):filtered.length===0?(
        <div className="empty">
          <div className="big">{clients.length===0?"Todavía no hay clientes":"Sin resultados"}</div>
          {clients.length===0&&<p style={{fontSize:13}}>Creá el primero con el botón "Nuevo cliente"</p>}
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:11}}>
          {filtered.map(client=>{
            const aud=(client.sesiones||[]).filter(s=>s.tipo==="audit");
            const fol=(client.sesiones||[]).filter(s=>s.tipo==="follow");
            const last=client.sesiones?.length>0?client.sesiones[client.sesiones.length-1]?.fecha:null;
            return <div key={client.id} className="client-card fade-in">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:5}}>
                    <div style={{width:36,height:36,borderRadius:"50%",background:"#FDF6E3",border:"2px solid var(--dorado)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,color:"var(--dorado)",flexShrink:0}}>
                      {(client.nombre||"?")[0].toUpperCase()}
                    </div>
                    <div>
                      <div style={{fontSize:15,fontWeight:600,color:"var(--texto)"}}>{client.nombre}</div>
                      {client.empresa&&<div style={{fontSize:12,color:"var(--texto-sec)"}}>{client.empresa}</div>}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:14,flexWrap:"wrap",marginLeft:46,marginBottom:8}}>
                    {client.industria&&<span style={{fontSize:11.5,color:"var(--texto-sec)"}}>🏢 {client.industria}</span>}
                    {client.tel&&<span style={{fontSize:11.5,color:"var(--texto-sec)"}}>📱 {client.tel}</span>}
                    {client.email&&<span style={{fontSize:11.5,color:"var(--texto-sec)"}}>✉️ {client.email}</span>}
                  </div>
                  <div style={{display:"flex",gap:7,flexWrap:"wrap",marginLeft:46}}>
                    <span className="chip chip-audit">📋 {aud.length} auditoría{aud.length!==1?"s":""}</span>
                    <span className="chip chip-follow">📈 {fol.length} seguimiento{fol.length!==1?"s":""}</span>
                    {last&&<span className="chip chip-date">Última: {last}</span>}
                  </div>
                </div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>onChecklist(client)}>✅ Onboarding</button>
                  <button className="btn btn-sm" style={{background:"#EEF3FB",color:"#2E5090",border:"1px solid #BFCFE8"}} onClick={()=>onAudit(client)}>📋 Auditoría</button>
                  <button className="btn btn-sm" style={{background:"#D1FAE5",color:"#065F46",border:"1px solid #A7F3D0"}} onClick={()=>onFollow(client)}>📈 Seguimiento</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>setDelId(client.id)}>🗑</button>
                </div>
              </div>
            </div>;
          })}
        </div>
      )}
    </div>

    {/* ── MODAL: Nuevo Cliente ── */}
    {showAdd&&<div className="modal-ov" onClick={()=>setShowAdd(false)}>
      <div className="modal-box modal-sm" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h2>Nuevo Cliente</h2>
          <button className="modal-close" onClick={()=>setShowAdd(false)}>×</button>
        </div>

        {/* Botón importar */}
        <button className="btn btn-ghost" style={{width:"100%",marginBottom:18,justifyContent:"center",gap:8}}
          onClick={()=>{setShowAdd(false);openImport();}}>
          📥 Importar desde Dashboard Talento Impulsa
        </button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={{flex:1,height:1,background:"var(--borde)"}}/>
          <span style={{fontSize:11,color:"var(--texto-sec)",fontWeight:600}}>O CARGAR MANUALMENTE</span>
          <div style={{flex:1,height:1,background:"var(--borde)"}}/>
        </div>

        {[
          {l:"Nombre *",       k:"nombre",    p:"Nombre completo",        t:"text"},
          {l:"Empresa",        k:"empresa",   p:"Opcional",               t:"text"},
          {l:"Industria",      k:"industria", p:"Ej: Tecnología, RRHH...",t:"text"},
          {l:"📱 Teléfono",    k:"tel",       p:"+54 9 11...",            t:"tel"},
          {l:"✉️ Email",       k:"email",     p:"cliente@email.com",      t:"email"},
        ].map(f=><div key={f.k} className="field">
          <label>{f.l}</label>
          <input type={f.t} value={form[f.k]} onChange={e=>setForm(p=>({...p,[f.k]:e.target.value}))} placeholder={f.p}/>
        </div>)}

        <div style={{display:"flex",gap:10,marginTop:6}}>
          <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowAdd(false)}>Cancelar</button>
          <button className="btn btn-primary" style={{flex:1}} onClick={addClient}>Guardar cliente</button>
        </div>
      </div>
    </div>}

    {/* ── MODAL: Importar del Dashboard ── */}
    {showImport&&<div className="modal-ov" onClick={()=>setShowImport(false)}>
      <div className="modal-box modal-lg" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h2>📥 Importar del Dashboard</h2>
          <button className="modal-close" onClick={()=>setShowImport(false)}>×</button>
        </div>
        <p style={{fontSize:13,color:"var(--texto-sec)",marginBottom:16}}>
          Seleccioná un cliente del Dashboard Talento Impulsa para pre-llenar el formulario. Podrás revisar los datos antes de guardar.
        </p>

        {dashLoading?(
          <div style={{textAlign:"center",padding:"32px",color:"var(--texto-sec)"}}>Cargando clientes del Dashboard...</div>
        ):dashClients.length===0?(
          <div className="empty"><div className="big">No hay clientes en el Dashboard</div></div>
        ):(
          <>
            <div className="search-wrap" style={{marginBottom:14}}>
              <span className="search-icon">🔍</span>
              <input value={dashSearch} onChange={e=>setDashSearch(e.target.value)} placeholder="Buscar por nombre o empresa..."/>
            </div>
            <div style={{maxHeight:340,overflowY:"auto"}}>
              {dashFiltered.length===0?(
                <p style={{textAlign:"center",color:"var(--texto-sec)",padding:"20px"}}>Sin resultados</p>
              ):dashFiltered.map(dc=>(
                <div key={dc.id} className="import-item" onClick={()=>importClient(dc)}>
                  <div>
                    <div className="name">{dc.name||"Sin nombre"}</div>
                    <div className="meta">
                      {dc.company&&<span>🏢 {dc.company}</span>}
                      {dc.email&&<span style={{marginLeft:10}}>✉️ {dc.email}</span>}
                      {(dc.phone||dc.contact)&&<span style={{marginLeft:10}}>📱 {dc.phone||dc.contact}</span>}
                    </div>
                  </div>
                  <span className="btn btn-primary btn-sm" style={{pointerEvents:"none"}}>Usar este</span>
                </div>
              ))}
            </div>
          </>
        )}
        <div style={{marginTop:18}}>
          <button className="btn btn-ghost" style={{width:"100%"}} onClick={()=>setShowImport(false)}>Cancelar</button>
        </div>
      </div>
    </div>}

    {/* ── MODAL: Confirmar eliminar ── */}
    {delId&&<ConfirmModal icon="🗑️" title="¿Eliminar cliente?"
      msg="Se borrarán todos sus datos del Hub PCA™.<br/><strong>Esta acción no se puede deshacer.</strong>"
      onOk={()=>delClient(delId)} onCancel={()=>setDelId(null)} okLabel="Sí, eliminar" okColor="#dc2626"/>}
  </div>;
}

/* ══════════════════════════════════════
   APP ROOT
══════════════════════════════════════ */
/* ══════════════════════════════════════
   LOGIN (Google · cuentas autorizadas)
══════════════════════════════════════ */
function LoginScreen({status,error,onLogin}){
  const busy = status==="checking"||status==="opening";
  return <div style={{minHeight:"100vh",background:"var(--cream)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <form onSubmit={e=>{e.preventDefault();onLogin();}} style={{background:"#fff",borderRadius:16,padding:"36px 28px",width:"min(380px,100%)",boxShadow:"0 8px 24px rgba(26,24,20,.08)",textAlign:"center"}}>
      <div style={{fontSize:11,letterSpacing:".22em",textTransform:"uppercase",color:"#9A7B3D",fontWeight:600,marginBottom:6}}>Talento Impulsa</div>
      <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:30,color:"var(--texto)",marginBottom:20}}>Hub PCA™</div>
      {error && <div style={{background:"#FEE2E2",color:"#B91C1C",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:14,textAlign:"left"}}>{error}</div>}
      <button type="submit" disabled={busy} style={{width:"100%",padding:"12px 16px",border:"none",borderRadius:10,background:"#9A7B3D",color:"#fff",fontFamily:"inherit",fontSize:15,fontWeight:600,cursor:busy?"wait":"pointer",opacity:busy?.7:1}}>
        {status==="checking"?"Verificando sesión…":status==="opening"?"Abriendo Google…":"Ingresar con Google"}
      </button>
      <div style={{fontSize:12,color:"var(--texto-sec)",marginTop:14}}>Acceso solo para las cuentas autorizadas de Talento Impulsa.</div>
    </form>
  </div>;
}

function App(){
  const [screen,  setScreen]  = useState("home");
  const [client,  setClient]  = useState(null);
  const [authSt,  setAuthSt]  = useState("checking"); // checking | out | opening | in
  const [authErr, setAuthErr] = useState("");

  useEffect(()=>{
    const unsub = auth.onAuthStateChanged(async user=>{
      if(user && !user.isAnonymous){
        const email=(user.email||"").toLowerCase();
        if(!ALLOWED_EMAILS.includes(email)){
          await auth.signOut();
          setAuthErr("La cuenta "+email+" no tiene acceso al Hub PCA™.");
          setAuthSt("out"); return;
        }
        setAuthErr(""); setAuthSt("in"); return;
      }
      if(user && user.isAnonymous){ try{ await auth.signOut(); }catch(_){} }
      setAuthSt("out");
    });
    return ()=>unsub();
  },[]);

  const login = async () => {
    setAuthErr(""); setAuthSt("opening");
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await auth.signInWithPopup(provider);
    }catch(ex){
      const map={"auth/popup-closed-by-user":"Cerraste la ventana de Google antes de terminar.","auth/popup-blocked":"El navegador bloqueó la ventana de Google. Permití ventanas emergentes para este sitio.","auth/unauthorized-domain":"Este dominio no está autorizado en Firebase Authentication.","auth/operation-not-allowed":"El ingreso con Google no está activado en Firebase Authentication."};
      setAuthErr(map[ex.code]||ex.message); setAuthSt("out");
    }
  };
  const logout = async () => { if(!window.confirm("¿Cerrar sesión?")) return; try{ await auth.signOut(); }catch(_){} window.location.reload(); };

  const go = (sc,cl) => { setClient(cl||null); setScreen(sc); window.scrollTo({top:0}); };

  if(authSt!=="in") return <LoginScreen status={authSt} error={authErr} onLogin={login}/>;

  const SalirBtn = <button onClick={logout} title={"Cerrar sesión ("+(auth.currentUser?.email||"")+")"} style={{position:"fixed",right:14,bottom:14,zIndex:50,padding:"7px 14px",borderRadius:999,border:"1px solid #C8C0B5",background:"#fff",color:"var(--texto-sec)",fontFamily:"inherit",fontSize:12,cursor:"pointer",boxShadow:"0 2px 8px rgba(26,24,20,.08)"}}>Salir</button>;

  if(screen==="checklist") return <>{SalirBtn}<ChecklistScreen client={client} onBack={()=>go("home")}/></>;
  if(screen==="audit")     return <>{SalirBtn}<AuditScreen     client={client} onBack={()=>go("home")}/></>;
  if(screen==="follow")    return <>{SalirBtn}<FollowScreen     client={client} onBack={()=>go("home")}/></>;
  return <>{SalirBtn}<HomeScreen onAudit={c=>go("audit",c)} onFollow={c=>go("follow",c)} onChecklist={c=>go("checklist",c)}/></>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
